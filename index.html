<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Denna’s Trading — Story sale generator</title>
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="mark">Denna’s Trading</span>
    <span class="tab on">Story sale</span>
    <span class="spacer"></span>
    <span class="seg" title="Format">
      <button class="btn" data-format="story">9:16</button>
      <button class="btn" data-format="post">4:5</button>
    </span>
    <span class="sep"></span>
    <button class="btn" id="preview">Preview</button>
    <span class="sep"></span>
    <button class="btn primary" id="png">Download PNG</button>
    <button class="btn" id="png2x" title="Double resolution (2160 × 3840) — sharper on Instagram">PNG HD (2×)</button>
    <button class="btn" id="pdf">PDF / print</button>
    <span class="sep"></span>
    <button class="btn" id="save">Save</button>
    <button class="btn" id="open">Open</button>
    <button class="btn" id="share">Share link</button>
    <button class="btn" id="reset">Reset</button>
  </header>
  <div class="main">
    <div class="stage"><div class="stage-inner"><div class="page"></div></div></div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>

<script src="js/vendor/html-to-image.min.js"></script>
<script src="js/brand.js"></script>
<script src="js/sale-store.js"></script>
<script src="js/editor.js"></script>
<script src="js/sale-card.js"></script>
<script src="js/sale-panel.js"></script>
<script src="js/storysale.js"></script>
<script>
  /* The story-sale store registers itself as `Store`, so the shared
     editor runtime — toolbar, in-place editing, export — drives this
     artboard exactly as it drives the agenda's. */
  SalePanel.init({ mount: '#panel' });
  StorySale.init();
  Editor.wireBar({
    filename: 'dennas-story-sale.png',
    jsonName: 'dennas-story-sale.json',
    resetText: 'Reset everything to the approved story? Your own photos and changes will be lost.',
    shareNote: 'The link carries the text, colours and layout — not the photos. Use Save for a file that includes them.',
    onData: function () { StorySale.render(); }
  });
</script>
</body>
</html>
